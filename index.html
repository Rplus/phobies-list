<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Phobies list</title>
<style>
	#el_form {
		position: fixed;
		right: 0;
		top: 0;
		bottom: 0;
		z-index: 2;
		background-color: #0009;
		backdrop-filter: blur(3px);
		padding-left: 0.5em;

		.filter-toggle {
			text-align: right;
			outline: none;
			cursor: pointer;
			padding: 0.5em;
		}

		&:not(:has(#el_form_details[open])) {
			opacity: 0.75;
			bottom: unset;
		}
	}

	#el_form_details:not([open]) .filter-toggle .txt {
		display: none;
	}

	#el_reset {
		position: absolute;
		top: .5em;
		left: .5em;
	}

	#el_filters {
		max-height: calc(100vh - 4em);
		min-width: 250px;
		overflow-y: auto;
		line-height: 1;
		font-size: smaller;
		flex-wrap: wrap;
		margin-top: 1em;
		gap: 1em;
		display: grid;
		user-select: none;

		@media (max-width: 660px) {
			font-size: small;
		}

		dd {
			margin: 0 0 .25em;
		}

		input[type="checkbox"] {
			font-size: smaller;
			width: 1em;
			height: 1em;
		}

		fieldset {
			position: relative;
			margin: 0;

			div:has(fieldset) {
				display: grid;
				gap: 1em;
				grid-auto-flow: column;
				grid-auto-columns: 1fr;
			}
		}

		legend {
			text-transform: capitalize;
			/* position: sticky; */
			/* top: 0; */
			/* background-color: #666; */
		}

		summary {
			position: absolute;
			top: -1em;
			left: 0;
			width: 100%;
			cursor: pointer;
			color: #990;
		}

		details[data-cate="cost"] div {
			columns: 2;
		}
	}

	.filter-label {
		align-items: center;
	}

	#el_list {
		display: grid;
		width: 100%;
		max-width: 1400px;
		margin-left: auto;
		margin-right: auto;
		grid-template-columns: repeat(12, 1fr);
		padding: .5em 1em;
		margin-bottom: max(40vh, 20em);
		font-size: smaller;
		@media (max-width: 960px) {
			grid-template-columns: repeat(6, 1fr);
		}
	}

	.head,
	.item {
		grid-column: span 12;
		display: grid;
		grid-template-columns: subgrid;
		grid-template-areas: "name cost race rarity movement_type movement_range attack_type attack_range health attack damage_range abilities";

		@media (max-width: 960px) {
			box-shadow: .25em .25em #0003;
			margin-bottom: 1em;
			grid-template-columns: repeat(6, 1fr);
			grid-template-areas:
			  "name      cost   race   movement_type  attack_type  damage_range"
			  "abilities rarity health movement_range attack_range attack";
		}
		@media (max-width: 400px) {
			margin-bottom: 2em;
			grid-template-columns: repeat(4, 1fr);
			grid-template-areas:
				"name          cost   movement_type movement_range"
				"race          rarity attack_type   attack_range"
				"abilities health damage_range  attack"
			  /* "name      cost   race   movement_type  attack_type  damage_range" */
			  /* "abilities rarity health movement_range attack_range attack"; */
		}


		& > div {
			&:nth-child(1) { grid-area: name;}
			&:nth-child(2) { grid-area: cost;}
			&:nth-child(3) { grid-area: race;}
			&:nth-child(4) { grid-area: rarity;}
			&:nth-child(5) { grid-area: movement_type;}
			&:nth-child(6) { grid-area: movement_range;}
			&:nth-child(7) { grid-area: attack_type;}
			&:nth-child(8) { grid-area: attack_range;}
			&:nth-child(9) { grid-area: health;}
			&:nth-child(10) { grid-area: attack;}
			&:nth-child(11) { grid-area: damage_range;}
			&:nth-child(12) { grid-area: abilities;}
		}
	}

	#el_list.is-grouped {
		display: block;
		min-width: 50vw;
		max-width: 1200px;
		width: fit-content;
		margin: 0 auto 5em;
		/* background-color: #fff1; */
	}

	.grouped-heros-cate {
		margin-bottom: 1.5em;
		/* width: fit-content; */

		h3 {
			margin-bottom: .25em;
		}
	}

	.grouped-heros-box {
		display: grid;
		grid-template-columns: repeat(4, 1fr);
		background-color: #0003;
		border-radius: 0 1em 1em 1em;

		.grouped-heros-cate[data-cate="race"] & {
			display: block;
		}

		body:has(#class-spliter:checked) & {
			display: grid;
			grid-auto-flow: row dense;
			/* grid-template-columns: repeat(7, 1fr); */

			.grouped-hero {
				&[data-class-mage="1"],
				&[data-class-warrior="1"],
				&[data-class-rogue="1"] {
					border-left: 1px dashed #fff3;
				}
			}
		}
	}

	.grouped-hero {
		position: relative;
		display: block;
		text-align: center;
		font-size: smaller;
		padding: .5em;

		img {
			display: block;
			object-fit: contain;
		}

		div {
			opacity: 0.5;
		}

		&:hover {
			background-color: #fff1;

			div {
				opacity: 1;
			}
		}

		.grouped-hero__name {
			display: inline-flex;
			max-width: 60px;
			justify-content: center;
			line-height: 1.1;
			white-space: nowrap;

			& a {
				color: inherit;

				&:not(:hover) {
					text-decoration: none;
				}
			}
		}

		.grouped-hero__details-btn {
			position: absolute;
			inset: 0;
			border-width: 0;
			cursor: cell;
			opacity: 0;
		}
	}

	.grouped-heros-classbox {
		display: flex;
		flex-wrap: wrap;
		align-items: start;
		align-content: flex-start;
		justify-content: center;
		padding: 0.25em;
		padding-top: .5em;
		padding-bottom: 1em;
		gap: .25em;
		background-image:
			linear-gradient(-115deg, #0001, #0000 30%),
			linear-gradient(100deg, #9991, #0000 10%);

		.grouped-heros-cate[data-cate="class"] &:empty {
			display: none;
		}
	}

	.head {
		position: sticky;
		top: 0;
		order: -10000000000;
		background-color: rgba(var(--bgc), .75);
		background-color: #666c;
		text-transform: uppercase;
		font-size: small;
		font-weight: 900;
		backdrop-filter: blur(1px);
		user-select: none;
		cursor: pointer;

		@media (max-width: 1200px) {
			font-size: 10px;
		}

		& .label {
			white-space: pre-wrap;
		}

		div[data-index="1"],
		div[data-index="3"],
		div[data-index="4"],
		div[data-index="6"],
		div[data-index="8"],
		div[data-index="9"] {
			display: inline-flex;
			align-items: center;
			gap: .25em;

			&::after {
				content: '';
				display: inline-flex;
				width: 24px;
				height: 24px;
				opacity: .5;
				background: url('./icons/Icon_health.webp') 50% / contain no-repeat;
			}
		}

		div[data-index="1"]::after {
			background-image: url('./icons/Icon_KeyCost.webp');
		}
		div[data-index="3"]::after {
			background-image: url('./icons/Icon_mod_stunned.webp');
		}
		div[data-index="4"]::after {
			background-image: url('./icons/Icon_movement_walk.webp');
		}
		div[data-index="6"]::after,
		div[data-index="9"]::after {
			background-image: url('./icons/Icon_damage.webp');
		}

	}

	.head,
	.item {
		ul:not(.is-grouped) & {
			display: grid;
			grid-column: 1 / -1;
			grid-template-columns: subgrid;

			img:hover {
				background-color: #fff1;
			}

			& > div {
				/* max-width: 100px; */
				padding: 0.5em 0.25em;
				text-align: center;
				border-top: 1px dotted #fff3;
				border-left: 1px dotted #fff3;
				place-content: center;

				&:last-of-type {
					border-right: 1px dotted #fff3;
				}

				&[data-name] {
					text-align: start;
				}
			}
		}
	}

	.item .label {
		display: none;
	}

	.value {
		white-space: pre-wrap;
		place-content: center;
		text-align: center;
		line-height: 1;

		&[data-value="undefined"] {
			opacity: 0.3;
			font-size: smaller;
			font-size: 0;
			&::before {
				font-size: 1rem;
				content: '-';
			}
		}

		a {
			text-decoration: unset;
			display: block;
		}
	}

	.trait-box {
		display: inline-flex;
		align-items: center;
		padding: 2px .5em;
		margin: 0.2em 0;

		&:hover {
			background-color: #fff3;
		}

		&::before { content: '['; padding-inline-end: 2px; }
		&::after { content: ']'; padding-inline-start: 2px; }
	}

	.item div[data-race],
	.item div[data-attack_type],
	.item div[data-damage_range],
	.item div[data-movement_type] {
		font-size: 10px;
		color: #fff9;

		& .value::before {
			content: '';
			display: block;
			margin: 0 auto;
			width: 40px;
			height: 40px;
			background-position: 50%;
			background-repeat: no-repeat;
			background-size: contain;
			background-image: var(--bgi);
		}
	}

	#dialog_ctx td {
		& .td-value {
			display: inline-flex;

			&::before {
				content: '';
				display: inline-block;
				width: 20px;
				height: 20px;
				background-position: 50%;
				background-repeat: no-repeat;
				background-size: contain;
				background-image: var(--bgi);
			}
		}
	}

	[data-race="Dimensional"] { --bgi: url('./icons/Icon_race_dimensional.webp'); }
	[data-race="Mechanical"] { --bgi: url('./icons/Icon_race_mechanical.webp'); }
	[data-race="Monster"] { --bgi: url('./icons/Icon_race_monster.webp'); }
	[data-race="Undead"] { --bgi: url('./icons/Icon_race_undead.webp'); }

	[data-movement_type="Walking"] { --bgi: url('./icons/Icon_movement_walk.webp'); }
	[data-movement_type="Flying"] { --bgi: url('./icons/Icon_movement_fly.webp'); }
	[data-movement_type="Bypassing"] { --bgi: url('./icons/Bypass.webp'); }

	[data-attack_type="Targeted AOE"],
	[data-attack_type="Single Target Attack"],
	[data-damage_range="Line of Sight"],
	[data-attack_type="Line of Sight"] { --bgi: url('./icons/Icon_range_line_of_sight.webp'); }

	[data-attack_type="Lob"] { --bgi: url('./icons/Icon_range_lob.webp'); }
	[data-attack_type="Self-Initiated AOE"] { --bgi: url('./icons/Icon_self_aoe.webp'); }

	[data-trap],
	[data-buff],
	[data-attack],
	[data-effect_range="Self-Initiated AOE"],
	[data-effect_range="Single Target Attack"],
	[data-damage_range="Single Target Attack"] { --bgi: url('./icons/Icon_damage.webp'); }

	[data-effect_range="Targeted AOE Attack"],
	[data-damage_range="Targeted AOE Attack"] { --bgi: url('./icons/Icon_damage_AOE.webp'); }

	[data-effect_range="Splash AOE Attack"],
	[data-damage_range="Splash AOE Attack"] { --bgi: url('./icons/Icon_big_aoe.webp'); }

	[data-resurrect],
	[data-health] { --bgi: url('./icons/Icon_health.webp'); }

	[data-debuff] { --bgi: url('./icons/Icon_mod_damage_debuff.webp'); }
	[data-unlocking] { --bgi: url('./icons/Icon_lock.webp'); }
	[data-heal] { --bgi: url('./icons/Icon_healing_kit.webp'); }
	[data-cooldown] { --bgi: url('./icons/Clock.webp'); }
	[data-lifesteal] { --bgi: url('./icons/Icon_leech.webp'); }
	[data-effect_duration] { --bgi: url('./icons/Icon_hex.webp'); }
	[data-disease] { --bgi: url('./icons/Icon_disease.webp'); }
	[data-electric] { --bgi: url('./icons/Icon_electrical.webp'); }
	[data-poison] { --bgi: url('./icons/Icon_poison.webp'); }
	[data-duration] { --bgi: url('./icons/Icon_timer.webp'); }

	[data-fire] { --bgi: url('./icons/Icon_fire.webp'); }
	[data-effect_range="Beam Attack"] { --bgi: url('./icons/Icon_beam.webp'); }
	[data-effect_range="Dash Attack"] { --bgi: url('./icons/Icon_charge.webp'); }
	[data-heartheal] { --bgi: url('./icons/Icon_heartheal.webp'); }
	[data-obstacle] { --bgi: url('./icons/Terraform_ObstacleCreate_GraveDigger.webp'); }

	.flex {
		display: flex;
	}

	body {
		margin: 0;
		background-color: rgb(var(--bgc));
		color: rgb(var(--main-color));
		overflow-y: scroll;
	}

	:root {
		--bgc: 51, 51, 51;
		--main-color: 238, 238, 238;
		color-scheme: dark;
		font-family: sans-serif;
	}

	* {
		box-sizing: border-box;
		scrollbar-width: thin;
		/* scrollbar-width: none; */
		scrollbar-color: #8886 #0000;
		/* scrollbar-gutter: stable both-edges; */
		scrollbar-gutter: stable;
	}

	ul {
		margin: 0;
		padding: 0;
	}

	hr {
		border: 1px dashed;
		border-width: 0px;
		border-top-width: 1px;
		opacity: 0.25;
	}
	h1 {
		text-align: center;
		width: fit-content;
		padding: .25em 2vw;
		margin: 0 auto;
	}
	#el_switcher {
		display: block;
		text-transform: capitalize;
		margin: 0 auto;
	}

	#goback {
		position: absolute;
		color: inherit;
		top: 0;
		left: 0;
		width: 3em;
		height: 3em;
		display: flex;
		padding: .25em;
		background-image: linear-gradient(135deg, #fff3 50%, #0000 50%);

		&:not(:hover) {
			opacity: .5;
		}
	}

	#dialog {
		text-transform: capitalize;

		img {
			object-fit: contain;
		}

		button {
			position: absolute;
			right: 0;
			top: 0;
		}

		tr:hover {
			background-color: #fff3;
		}

		&::backdrop {
			background-color: #0009;
			backdrop-filter: blur(2px);
		}

		td {
			text-align: left;

			&:first-child {
				text-align: right;
			}

			&[colspan="2"] {
				text-align: center;
			}
		}

	}
	img {
		user-select: none;
	}
	table {
		table-layout: fixed;
		margin: 0 auto;
		border-collapse: collapse;

		td {
			padding: 2px 0.25em;
			border: 1px dotted #fff3;
		}
	}

	.td-value {
		max-width: 20em;
	}

	dialog details {
		margin-top: 1em;
		margin-bottom: 1em;
	}
</style>
</head>

	<select id="el_switcher"></select>

	<div id="app">

		</form>

		<ul id="el_list"></ul>
		<dialog id="dialog">
			<div id="dialog_ctx"></div>
			<button onclick="fn_toggle_dialog(false)">✖</button>
		</dialog>

	</div>

	<script>
		// init
		// init
		// init

		const IMG_PATH = 'https://static.wikia.nocookie.net/phobies/images/';
		const DEFAULT_ICON = 'e/e8/Lippy.png';
		const WIKISITE = 'https://phobies.fandom.com/';
		// const WIKISITE = 'https://phobies.antifandom.com/';
		// const WIKISITE = 'https://breezewiki.com/phobies/';

		let props = [
			'name',
			'cost',
			'race',
			'rarity',
			'movement_type',
			'movement_range',
			'attack_type',
			'attack_range',
			'health',
			'attack',
			'damage_range',
			'abilities',
		];

		let switcher_props = [
			'cost',
			'race',
			'rarity',
			'movement_range',
			'movement_type',
			'attack_range',
			'attack_type',
			'damage_range',
		];

		let filter_props = [
			'race',
			'cost',
			'rarity',
			'movement_range',
			'movement_type',
			'attack_range',
			'attack_type',
			'damage_range',
		];

		let filter_rendering_grounp = [
			'race',
			'cost',
			'rarity',
			'movement_range',
			'movement_type',
			'attack_range',
			'attack_type',
			'damage_range',
			// {
			// 	title: 'type',
			// 	items: [
			// 		'damage_type',
			// 		'armor_type',
			// 	],
			// 	open: true,
			// },
		];

		const skill_baned_props = [
			'type',
			'title',
			'icon_title',
			'icon_url',
		];

		String.prototype.sanitize = function() {
			return this.replace(/[,\s\']/g, '_');
		};

		// init order number
		const TEXT_BASE = 10000000;

		heros.forEach(hero => {
			hero.order = {};
			props.forEach((prop, index) => {
				if (prop === 'abilities') {
					return;
				}
				// 使用 ?? 和 ||，直接把 undefined, null, '' 統一過濾並轉成字串 '0'
				let order_target = (hero[prop] ?? '') || '0';

				// 1. 處理純數字字串
				if (!isNaN(order_target)) {
					hero.order[prop] = Number(order_target);
				}

				// 2. 處理文字字串（純英數優化版，完全消滅內部隱藏迴圈）
				else {
					// const str = order_target;
					const str = order_target.toUpperCase();
					const c1 = str.codePointAt(0) ?? 32; // 第一個字，沒字補空格 (32)
					const c2 = str.codePointAt(1) ?? 32; // 第二個字
					const c3 = str.codePointAt(2) ?? 32; // 第三個字

					// 透過 256 進位制做純數學拼接，第一個字元權重最高，且絕不溢位碰撞
					const textWeight = (c1 * 65536) + (c2 * 256) + c3;

					hero.order[prop] = TEXT_BASE + textWeight;
				}
			});
		});

		let us_cate = fn_get_us_cate(location);
		el_filters.innerHTML = fn_gen_filterdom();

		if (!us_cate) {
			el_list.innerHTML = fn_gen_list();
		} else {
			init_grouped_hero(us_cate);
		}

		const mediaQuery = window.matchMedia('(min-width: 1300px)');
		if (mediaQuery.matches) {
			el_form_details.open = true;
		}

		function fn_get_us_cate(url_obj = location) {
			let _us = new URLSearchParams(url_obj.search);
			let _us_cate = ( switcher_props.includes(_us.get('cate')) && _us.get('cate') );
			return _us_cate || '';
		}

		function init_grouped_hero(_cate = switcher_props[0]) {
			el_list.classList.add('is-grouped');
			el_switcher.value = _cate;
			el_list.innerHTML = fn_gen_groupby(_cate);
		}

		fn_gen_switcher();

		function fn_gen_switcher() {
			el_switcher.innerHTML = `<option value="">= list view =</option>` + switcher_props.map(prop => {
				return `<option value="${prop}" ${prop === us_cate ? 'selected' : ''}>${prop}</option>`;
			}).join('');

			el_switcher.addEventListener('change', (e) => {
				let _cate = e.target.value;
				console.log(e.target.value);
				if (_cate) {
					// location.href = `?cate=${_cate}`;
					window.history.pushState(null, '', `?cate=${_cate}`);
				} else {
					location.href = './index.html';
				}
			});

			if (window.navigation) {
				navigation.addEventListener('navigate', (event) => {
					if (!event.destination.sameDocument) {
						return;
					}
					let _us_cate = fn_get_us_cate(new URL(event.destination.url));
					if (_us_cate) {
						init_grouped_hero(_us_cate);
					} else {
						location.href = './index.html';
					}
				});
			}
		}

		function fn_gen_groupby(_cate) {
			console.log(22, 'fn_gen_groupby');
			let prop_2nd = 'race';

			// o_filters

			let heros_grouped = Object.groupBy(heros, (i) => i[_cate]);
			for (let cate in heros_grouped) {
				heros_grouped[cate] = Object.groupBy(heros_grouped[cate], i => i.race);
			}

			// console.log(22, heros_grouped);
			let _html = '';
			let s_class = o_filters[prop_2nd];

			for (let cate in heros_grouped) {
				let _hero_html = '';

				for (let _class of s_class) {
				// for (let _class in heros_grouped[cate]) {
					let _class_html = heros_grouped[cate][_class]?.map((hero) => {
						return fn_gen_grouped_hero(hero);
					}).join('') || '';
					_hero_html += `<div class="grouped-heros-classbox">${_class_html}</div>`;
				}

				_html += `<div class="grouped-heros-cate" data-cate="${_cate}">
					<h3>${cate}</h3>
					<div class="grouped-heros-box">
						${_hero_html}
					</div>
				</div>`;
			}

			return _html;

			function fn_sumarray(array) {
				return array.reduce((all, cur) => all + cur, 0);
			}

			function fn_gen_grouped_hero(hero, index) {
				let _props = fn_gen_hero_props(hero);
				return `
					<div class="grouped-hero item" ${_props}>
						<img src="${IMG_PATH}${hero.img}" width="60" height="60" loading="lazy">
						<button class="grouped-hero__details-btn" onclick="fn_toggle_dialog(true, '${hero.name}')"></button>
						<div class="grouped-hero__name">
							<a href="${WIKISITE}${hero.link}" target="_blank" rel="noopener">${hero.name}</a>
						</div>
					</div>
				`
			}
		}

		function fn_gen_hero_props(hero) {
			return props.map(p => {
				if (p === 'slots') {
					return ['slot1', 'slot2', 'slot3'].map(j => ` data-${j}_${hero[j]}`).join('');
				}
				return ` data-${p}_${(hero[p] + '').sanitize()}`;
			}).join('');
		}

		function fn_gen_list() {
			return (
				'<li id="el_head" class="head" data-dir="-1">' + props.map((p, index) => `<div data-index="${index}">
					<span class="label">${p.split('_').join('\n')}</span>
				</div>`).join('') + '</li><style id="el_head_style"></style>'
			) +
			heros.map(hero => {
				let _props = fn_gen_hero_props(hero);
				let orders_style = props.map(p => `--order-${p}: ${hero.order[p]};`).join(' ');
				return (
					`<li class="item" ${_props} style="${orders_style}">`
					+ props.map(p => fn_gen_td(hero, p)).join('')
					+ '</li>'
				);
			}).join('');

			function fn_gen_td(hero, p) {
				let ctx = hero[p];

				if (p === 'name') {
					ctx = `<a href="${WIKISITE}${hero.link}" target="_blank" rel="noopener"><img src="${IMG_PATH}${hero.img}" width="60" height="60" loading="lazy"><br/></a>${hero[p]}`;
				} else if (p === 'abilities') {
					let _skills = hero[p];
					if (_skills) {
						ctx = _skills.map((s, si) => {
							let _url = IMG_PATH + (s.icon_url || DEFAULT_ICON);
							return `<img src="${_url}" width="36" height="36" onclick="fn_toggle_dialog(true, '${hero.name}', ${si})"> `;
						}).join('')
					} else {
						ctx = '';
					}
				}

				return (
					`<div data-${p}="${hero[p]}">
							<div class="label">${p}:</div>
							<div class="value" data-value="${hero[p]}">${ctx}</div>
						</div>`
				);
			}
		}

		function fn_gen_filterdom(argument) {
			let filter_html = ``;

			let filter_cates = heros.reduce((all, hero) => {
				filter_props.forEach(prop => {
					if (!all[prop]) {
						all[prop] = [];
					}
					all[prop].push(hero[prop]);
				});
				return all;
			}, {});

			for (let cate in filter_cates) {
				filter_cates[cate] = [...new Set(filter_cates[cate])].sort();
			}
			console.log(123, filter_cates);
			window.o_filters = filter_cates;

			function fn_gen_checkboxs(cate) {
				let dd = filter_cates[cate].map(i => `
					<dd>
						<label class="filter-label flex">
							<input type="checkbox" name="${cate}" value="${(i + '').sanitize()}" id="filter-${cate}_${i}">
							${i}
						</label>
					</dd>
				`).join('');

				return `<fieldset>
					<legend>${cate}</legend>
					<details data-cate="${cate}" ${filter_cates[cate].length < 33 ? 'open' : ''}>
						<summary></summary>
						<div>
							${dd}
						</div>
					</details>
				</fieldset>`;
			}

			for (let group of filter_rendering_grounp) {
				if (typeof group === 'string') {
					filter_html += fn_gen_checkboxs(group)
				} else if (group.items) {
					filter_html += `<fieldset>
						<legend>${group.title}</legend>
						<details ${group.open ? 'open' : ''}>
							<summary></summary>
							<div>
								${group.items.map(fn_gen_checkboxs).join('')}
							</div>
						</details>
					</fieldset>`
				}
			}

			// el_form.querySelector(':scope > details').open = !us_cate;

			return filter_html;
		}

		// binding:
		// binding:
		// binding:

		window.el_form.addEventListener('input', fn_form_update);
		window.el_form.addEventListener('reset', fn_update_style);
		window.el_head?.addEventListener('click', fn_reorder_table);

		function fn_form_update() {
			let formData = new FormData(el_form);

			if (![...formData.entries()].length) {
				fn_update_style();
				return;
			}

			let pairs = {};
			for (const [key, value] of formData.entries()) {
				if (pairs.hasOwnProperty(key)) {
			    pairs[key].push(value);
				} else {
				  pairs[key] = [value];
				}
			}

			let selectors = [];
			for (let prop in pairs) {
				selectors.push(
					`.item.item:not(`+ pairs[prop].map(v => `[data-${prop}_${v}]`).join(',') +`)`
				)
			}

			let _style = selectors.join(',') + `{ display: none; }`;

			fn_update_style(_style);
		}

		function fn_update_style(style = '') {
			el_filter_style.innerHTML = style || '';
		}

		function fn_reorder_table(e) {
			let dir = +(el_head.dataset.dir) || 1;
			let index = e.target.closest('div')?.dataset.index;
			if (!index) {
				el_head_style.innerHTML = '';
				return;
			}
			index = +index;
			el_head.dataset.dir = dir * -1;
			el_head.dataset.prop = props[index];
			el_head.dataset.index = index;

			el_head_style.innerHTML = `li.item { order: calc(var(--order-${props[index]}, 0) * ${dir * -1}); }
			li.head div:nth-of-type(${index + 1}) { text-shadow: 1px 2px #00f; }`;
		}

		function fn_toggle_dialog(is_open = true, heroname = '', skill_index = 0) {
			if (!is_open) {
				dialog.close();
				dialog_ctx.innerHTML = '';
				return;
			}

			let hero = heros.find(i => i.name === heroname);
			if (!hero) { return; }

			dialog_ctx.innerHTML = fn_gen_hero_detail(hero);
			dialog.showModal();
		}

		function fn_gen_hero_detail(hero) {

			const skills = fn_gen_hero_skills(hero.abilities);

			return `<table>` +
				`<tr><td colspan="2" align="center"><a href="${WIKISITE}${hero.link}" target="_blank" rel="noopener"><img src="${IMG_PATH}${hero.img}" width="90" height="90" loading="lazy"></a></td></tr>` +
				props.map(prop => {
					if (prop === 'abilities') {
						return '';
					}
					return `<tr><td>${prop}</td><td data-${prop}="${hero[prop]}"><div class="td-value">${hero[prop]}</div></td></tr>`;
				}).join('') +
				`</table>` + skills;
		}

		function fn_sort_skill_prop(a, b) {
			if (a === 'description') { return -1; }
			if (b === 'description') { return 1; }
			return a.localeCompare(b);
		}

		function fn_gen_hero_skills(skills = []) {
			if (!skills.length) {
				return '';
			}
			return skills.map(skill => {
				let skill_props_html = Object.keys(skill).sort(fn_sort_skill_prop).map(_prop => {
					if (skill_baned_props.includes(_prop)) {
						return '';
					}
					return `<tr><td>${_prop}</td><td data-${_prop}="${skill[_prop]}"><div class="td-value">${skill[_prop]}</div></td></tr>`;
				}).join('');

				// let skill_props_html = '';
				// for (let _prop in skill) {
				// 	if (skill_baned_props.includes(_prop)) {
				// 		continue;
				// 	}

				// 	skill_props_html += `<tr><td>${_prop}</td><td data-${_prop}="${skill[_prop]}"><div class="td-value">${skill[_prop]}</div></td></tr>`;
				// }
				let _url = IMG_PATH + (skill.icon_url || DEFAULT_ICON);
				return `
					<hr>
					<hr>
					<details open>
						<summary>
							<img src="${_url}" width=36 height=36 align=center>
							${skill.type} Ability: ${skill.title}
						</summary>
						<div class="skill-box">
							<table>${skill_props_html}</table>
						</div>
					</details>
				`;
			}).join('');
		}

		dialog.addEventListener('click', (e) => {
			if (e.target === dialog) dialog.close();
		});

	</script>
