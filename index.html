<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Phobies list</title>
	<link rel="stylesheet" href="./style.css">
</head>

<body>

	<!-- <a id="goback" href="./">./</a> -->

	<h1>
		Phobies list
	</h1>

	<div class="flex jc-c" style="gap: 1em;">
		<select id="el_switcher"></select>
		<button id="el_larger_switcher" hidden data-large="0">[ Smaller ] / Larger</button>
	</div>

	<div id="app">

		<form id="el_form">
			<details id="el_form_details">
				<summary class="filter-toggle">
					<span class="txt">Filters</span>
				</summary>
				<div>
					<input type="reset" id="el_reset">
					<ul id="el_filters"></ul>
				</div>
			</details>
			<style id="el_filter_style"></style>
		</form>

		<ul id="el_list" class="el_list is-listed"></ul>
		<dialog id="dialog">
			<div id="dialog_ctx"></div>
			<button onclick="fn_toggle_dialog(false)">✖</button>
		</dialog>

	</div>

	<footer>
		data source:
		<a href="https://phobies.fandom.com/" rel="noopener noreferrer" target="_blank">https://phobies.fandom.com/</a>
		<br>
		<small>parsing time: <time id="elm_parsing_time"></time></small>
	</footer>

	<script src="./data_with_icon.js"></script>
	<script src="./main.js"></script>
</body>
</html>
